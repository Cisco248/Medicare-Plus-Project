name: "medicare-plus"

services:
  rag-system:
    container_name: rag-systemd

    build:
      context: ./rag
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - ./rag/.env

    environment:
      CHROMA_HOST: chroma-server
      CHROMA_PORT: "3000"
      COLLECTION_NAME: medicare-knowledge

    volumes:
      - rag-data:/app/temp/db

    depends_on:
      chroma-server:
        condition: service_started

    networks:
      - app-network

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  back-end-server:
    container_name: back-end-server

    depends_on:
      mysql-server:
        condition: service_healthy
      rag-system:
        condition: service_started

    build:
      context: ./server
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    env_file:
      - ./server/.env

    environment:
      RAG_HOST: http://rag-systemd
      RAG_PORT: "8000"

    volumes:
      - server-data:/app/data

    networks:
      - app-network

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  # Build the MySQL Database for Back-End Server
  mysql-server:
    container_name: mysql-server

    image: mysql:8.4

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: medicare_plus

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - app-network

    healthcheck:
      test: >
        mysqladmin ping -h localhost -uroot -proot123
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

    restart:  unless-stopped

  # Build the ChromaDB for the RAG Engine
  chroma-server:

    image: chromadb/chroma:latest
    container_name: chroma-server
    ports:
      - "3000:3000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: "/chroma/chroma"

    networks:
      - app-network

    command: run --host 0.0.0.0 --port 3000

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  rag-data:
  mysql-data:
  server-data:
  ollama-data:
  chroma-data:
