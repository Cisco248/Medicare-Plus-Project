name: client
description: "Medicare Plus"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  uuid: any
  mysql1: ^0.20.0
  dart_jsonwebtoken: ^3.4.1
  font_awesome_flutter: ^11.0.0
  bcrypt: ^1.2.0
  cryptography: ^2.9.0
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.3
  json_annotation: ^4.12.0
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  shared_preferences: ^2.5.5
  go_router: ^17.3.0
  dio: ^5.11.0

  flutter_health_connect:
    path: ../package
  file_picker: ^3.0.4
  path_provider: ^2.1.6


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.4
  build_runner: ^2.15.1
  json_serializable: ^6.14.1

flutter:
