# Build backend and RAG images, push them to Artifact Registry, and
# deploy both Cloud Run services when a commit is pushed to "gen".
#
# Required Google Cloud setup (project medicare-plus-506621):
#   - APIs: Artifact Registry, Cloud Run, Cloud SQL Admin, Secret Manager,
#     IAM Credentials
#   - Artifact Registry repo: medicare-plus (europe-west1)
#   - Cloud SQL instance: medicare-plus in us-central1 (database medicare_plus, user medicare_app)
#   - Secrets: mysql-password, jwt-secret-key, openai-api-key
#   - GCS bucket: medicare-plus-docs
#   - Workload Identity Federation bound to this GitHub repository

name: 'Build and Deploy to Cloud Run'

on:
  push:
    branches:
      - 'gen'

env:
  PROJECT_ID: 'medicare-plus-506621'
  REGION: 'europe-west1'
  AR_REPO: 'medicare-plus'
  BACKEND_SERVICE: 'medicare-plus'
  RAG_SERVICE: 'medicare-plus-rag'
  CLOUD_SQL_INSTANCE: 'medicare-plus-506621:us-central1:medicare-plus'
  DOCS_BUCKET: 'medicare-plus-docs'
  WORKLOAD_IDENTITY_PROVIDER: 'projects/68356394205/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
  DEPLOY_SERVICE_ACCOUNT: 'github-actions-deployer@medicare-plus-506621.iam.gserviceaccount.com'

jobs:
  deploy:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.DEPLOY_SERVICE_ACCOUNT }}'
          project_id: '${{ env.PROJECT_ID }}'
          token_format: 'access_token'
          access_token_lifetime: '3600s'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Docker Auth'
        run: gcloud auth configure-docker '${{ env.REGION }}-docker.pkg.dev' --quiet

      # - name: Download ML artifacts
      #   run: |
      #     gcloud storage cp \
      #       --recursive \
      #       gs://server-models \
      #       ./server/app/data/

      - name: 'Build and Push Containers'
        run: |-
          BACKEND_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend:${{ github.sha }}"
          RAG_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/rag:${{ github.sha }}"
          docker build --tag "${BACKEND_IMAGE}" ./server
          docker build --tag "${RAG_IMAGE}" ./rag
          docker push "${BACKEND_IMAGE}"
          docker push "${RAG_IMAGE}"
          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> "$GITHUB_ENV"
          echo "RAG_IMAGE=${RAG_IMAGE}" >> "$GITHUB_ENV"

      - id: 'deploy-rag'
        name: 'Deploy RAG to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: '${{ env.RAG_SERVICE }}'
          region: '${{ env.REGION }}'
          image: '${{ env.RAG_IMAGE }}'
          flags: >-
            --allow-unauthenticated
            --cpu=1
            --memory=2Gi
            --timeout=300
            --min-instances=1
            --max-instances=3
            --port=8080
          env_vars: |-
            APP_NAME=Medicare Plus RAG
            APP_VERSION=0.1.0
            COLLECTION_NAME=medicare-knowledge
          secrets: |-
            OPENAI_API_KEY=openai-api-key:latest

      - id: 'deploy-backend'
        name: 'Deploy backend to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: '${{ env.BACKEND_SERVICE }}'
          region: '${{ env.REGION }}'
          image: '${{ env.BACKEND_IMAGE }}'
          flags: >-
            --allow-unauthenticated
            --cpu=1
            --memory=1Gi
            --timeout=300
            --port=8080
            --add-cloudsql-instances=${{ env.CLOUD_SQL_INSTANCE }}
            --execution-environment=gen2
            --add-volume=name=docs,type=cloud-storage,bucket=${{ env.DOCS_BUCKET }}
            --add-volume-mount=volume=docs,mount-path=/app/uploads/documents
          env_vars: |-
            APP_NAME=MediCare Plus
            HOST=0.0.0.0
            DEBUG=false
            MYSQL_HOST=/cloudsql/${{ env.CLOUD_SQL_INSTANCE }}
            MYSQL_USER=medicare_app
            MYSQL_DATABASE=medicare_plus
            DOCUMENT_STORAGE_PATH=/app/uploads/documents
            RAG_BASE_URL=${{ steps.deploy-rag.outputs.url }}
          secrets: |-
            MYSQL_PASSWORD=mysql-password:latest
            JWT_SECRET_KEY=jwt-secret-key:latest

      - name: 'Show output'
        run: |-
          echo "RAG: ${{ steps.deploy-rag.outputs.url }}"
          echo "Backend: ${{ steps.deploy-backend.outputs.url }}"


